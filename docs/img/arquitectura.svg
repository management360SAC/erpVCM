<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" font-family="Segoe UI, Arial, sans-serif">
  <!-- Background -->
  <rect width="900" height="600" fill="#fafafa" rx="12"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#f57c00">Arquitectura del Sistema — VCM CRM</text>
  <line x1="60" y1="48" x2="840" y2="48" stroke="#e0e0e0" stroke-width="1.5"/>

  <!-- ── LAYER 1: CLIENT ── -->
  <rect x="60" y="70" width="780" height="90" rx="10" fill="#fff8f0" stroke="#f57c00" stroke-width="2"/>
  <text x="84" y="94" font-size="11" font-weight="700" fill="#f57c00" text-anchor="start">CLIENTE — Navegador Web</text>
  <!-- React box -->
  <rect x="140" y="103" width="160" height="40" rx="7" fill="#f57c00" opacity="0.9"/>
  <text x="220" y="128" text-anchor="middle" font-size="12" font-weight="700" fill="white">React 19 + TypeScript</text>
  <!-- MUI box -->
  <rect x="320" y="103" width="130" height="40" rx="7" fill="#e65100" opacity="0.9"/>
  <text x="385" y="128" text-anchor="middle" font-size="12" font-weight="700" fill="white">Material UI 7</text>
  <!-- Router box -->
  <rect x="470" y="103" width="130" height="40" rx="7" fill="#bf360c" opacity="0.9"/>
  <text x="535" y="128" text-anchor="middle" font-size="12" font-weight="700" fill="white">React Router v6</text>
  <!-- Recharts box -->
  <rect x="620" y="103" width="120" height="40" rx="7" fill="#e64a19" opacity="0.85"/>
  <text x="680" y="128" text-anchor="middle" font-size="12" font-weight="700" fill="white">Recharts + jsPDF</text>

  <!-- Arrow down -->
  <line x1="450" y1="162" x2="450" y2="185" stroke="#9e9e9e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="462" y="178" font-size="10" fill="#757575">JWT / HTTPS</text>

  <!-- ── LAYER 2: BACKEND ── -->
  <rect x="60" y="188" width="780" height="185" rx="10" fill="#f5f5f5" stroke="#5a5a5a" stroke-width="2"/>
  <text x="84" y="212" font-size="11" font-weight="700" fill="#5a5a5a">BACKEND — Spring Boot 2.2 (puerto 8080)</text>

  <!-- Security -->
  <rect x="80" y="222" width="180" height="48" rx="7" fill="#5a5a5a"/>
  <text x="170" y="243" text-anchor="middle" font-size="11" font-weight="700" fill="white">Spring Security</text>
  <text x="170" y="261" text-anchor="middle" font-size="10" fill="#e0e0e0">JWT Filter + BCrypt</text>

  <!-- Controllers -->
  <rect x="280" y="222" width="155" height="48" rx="7" fill="#616161"/>
  <text x="357" y="243" text-anchor="middle" font-size="11" font-weight="700" fill="white">Controllers (REST)</text>
  <text x="357" y="261" text-anchor="middle" font-size="10" fill="#e0e0e0">30 endpoints</text>

  <!-- Services -->
  <rect x="455" y="222" width="155" height="48" rx="7" fill="#757575"/>
  <text x="532" y="243" text-anchor="middle" font-size="11" font-weight="700" fill="white">Services (Lógica)</text>
  <text x="532" y="261" text-anchor="middle" font-size="10" fill="#e0e0e0">AiService, NpsService…</text>

  <!-- Repositories -->
  <rect x="630" y="222" width="180" height="48" rx="7" fill="#9e9e9e"/>
  <text x="720" y="243" text-anchor="middle" font-size="11" font-weight="700" fill="white">Repositories (JPA)</text>
  <text x="720" y="261" text-anchor="middle" font-size="10" fill="#f5f5f5">Spring Data JPA</text>

  <!-- Row 2 in backend -->
  <!-- Mail Service -->
  <rect x="80" y="288" width="210" height="70" rx="7" fill="#fff8f0" stroke="#f57c00" stroke-width="1.5"/>
  <text x="185" y="310" text-anchor="middle" font-size="11" font-weight="700" fill="#f57c00">MailService</text>
  <text x="185" y="328" text-anchor="middle" font-size="10" fill="#5a5a5a">SMTP Office365</text>
  <text x="185" y="346" text-anchor="middle" font-size="10" fill="#5a5a5a">@Async · Adjuntos PDF</text>

  <!-- AI Service -->
  <rect x="310" y="288" width="210" height="70" rx="7" fill="#fff8f0" stroke="#f57c00" stroke-width="1.5"/>
  <text x="415" y="310" text-anchor="middle" font-size="11" font-weight="700" fill="#f57c00">AiService</text>
  <text x="415" y="328" text-anchor="middle" font-size="10" fill="#5a5a5a">Gemini Flash · Vision API</text>
  <text x="415" y="346" text-anchor="middle" font-size="10" fill="#5a5a5a">AiContextService · CRM data</text>

  <!-- Scheduler -->
  <rect x="540" y="288" width="270" height="70" rx="7" fill="#fafafa" stroke="#9e9e9e" stroke-width="1.5"/>
  <text x="675" y="310" text-anchor="middle" font-size="11" font-weight="700" fill="#5a5a5a">Schedulers</text>
  <text x="675" y="328" text-anchor="middle" font-size="10" fill="#757575">ServiceTrackingScheduler</text>
  <text x="675" y="346" text-anchor="middle" font-size="10" fill="#757575">NpsAutoInviteService</text>

  <!-- Arrow down -->
  <line x1="450" y1="375" x2="450" y2="398" stroke="#9e9e9e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="460" y="392" font-size="10" fill="#757575">JPA / SQL</text>

  <!-- ── LAYER 3: DB ── -->
  <rect x="60" y="400" width="550" height="90" rx="10" fill="#f5f5f5" stroke="#5a5a5a" stroke-width="2"/>
  <text x="84" y="424" font-size="11" font-weight="700" fill="#5a5a5a">BASE DE DATOS — MySQL 8.0 (puerto 3306)</text>
  <rect x="80" y="432" width="120" height="42" rx="6" fill="#5a5a5a"/>
  <text x="140" y="451" text-anchor="middle" font-size="10" font-weight="700" fill="white">Clientes / Deals</text>
  <text x="140" y="466" text-anchor="middle" font-size="9" fill="#e0e0e0">clients · deal · leads</text>
  <rect x="220" y="432" width="120" height="42" rx="6" fill="#616161"/>
  <text x="280" y="451" text-anchor="middle" font-size="10" font-weight="700" fill="white">Facturación</text>
  <text x="280" y="466" text-anchor="middle" font-size="9" fill="#e0e0e0">quotes · invoices · payments</text>
  <rect x="360" y="432" width="120" height="42" rx="6" fill="#757575"/>
  <text x="420" y="451" text-anchor="middle" font-size="10" font-weight="700" fill="white">Operaciones</text>
  <text x="420" y="466" text-anchor="middle" font-size="9" fill="#e0e0e0">contracted_services · nps</text>
  <rect x="500" y="432" width="88" height="42" rx="6" fill="#9e9e9e"/>
  <text x="544" y="451" text-anchor="middle" font-size="10" font-weight="700" fill="white">Config</text>
  <text x="544" y="466" text-anchor="middle" font-size="9" fill="#f5f5f5">org · usuarios · roles</text>

  <!-- ── LAYER 3: EXTERNAL ── -->
  <rect x="640" y="400" width="200" height="90" rx="10" fill="#fff8f0" stroke="#f57c00" stroke-width="2"/>
  <text x="740" y="424" text-anchor="middle" font-size="11" font-weight="700" fill="#f57c00">APIs Externas</text>
  <rect x="655" y="432" width="170" height="28" rx="6" fill="#f57c00" opacity="0.85"/>
  <text x="740" y="451" text-anchor="middle" font-size="10" font-weight="700" fill="white">Google Gemini API (IA)</text>
  <rect x="655" y="465" width="170" height="20" rx="6" fill="#e65100" opacity="0.7"/>
  <text x="740" y="480" text-anchor="middle" font-size="10" font-weight="700" fill="white">SMTP Office365 (Email)</text>

  <!-- Arrow external -->
  <line x1="540" y1="330" x2="620" y2="440" stroke="#f57c00" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrowOrange)"/>

  <!-- PhpMyAdmin -->
  <rect x="640" y="505" width="200" height="45" rx="10" fill="#fafafa" stroke="#e0e0e0" stroke-width="1.5"/>
  <text x="740" y="524" text-anchor="middle" font-size="10" font-weight="700" fill="#9e9e9e">phpMyAdmin (puerto 8081)</text>
  <text x="740" y="540" text-anchor="middle" font-size="9" fill="#bdbdbd">Administración DB</text>

  <!-- Docker badge -->
  <rect x="60" y="508" width="200" height="42" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="160" y="527" text-anchor="middle" font-size="10" font-weight="700" fill="#1565c0">Docker Compose</text>
  <text x="160" y="543" text-anchor="middle" font-size="9" fill="#1976d2">vcm-mysql · vcm-backend · vcm-frontend</text>

  <!-- Markers -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9e9e9e"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f57c00"/>
    </marker>
  </defs>
</svg>
