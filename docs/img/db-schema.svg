<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="rel" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#9e9e9e"/>
    </marker>
  </defs>

  <rect width="960" height="560" fill="#fafafa" rx="12"/>
  <text x="480" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#f57c00">Esquema de Base de Datos — VCM CRM (MySQL 8.0)</text>
  <line x1="40" y1="44" x2="920" y2="44" stroke="#e0e0e0" stroke-width="1.5"/>

  <!-- ── CORE ── -->
  <!-- org -->
  <rect x="40" y="60" width="130" height="80" rx="7" fill="#5a5a5a"/>
  <rect x="40" y="60" width="130" height="24" rx="7" fill="#333"/>
  <rect x="40" y="76" width="130" height="8" rx="0" fill="#333"/>
  <text x="105" y="77" text-anchor="middle" font-size="10" font-weight="700" fill="white">🏢 org</text>
  <text x="52" y="100" font-size="9" fill="#e0e0e0">id · name</text>
  <text x="52" y="114" font-size="9" fill="#e0e0e0">ruc · email</text>
  <text x="52" y="128" font-size="9" fill="#e0e0e0">created_at</text>

  <!-- usuarios -->
  <rect x="40" y="158" width="130" height="90" rx="7" fill="#5a5a5a"/>
  <rect x="40" y="158" width="130" height="24" rx="7" fill="#333"/>
  <rect x="40" y="174" width="130" height="8" rx="0" fill="#333"/>
  <text x="105" y="175" text-anchor="middle" font-size="10" font-weight="700" fill="white">👤 usuarios</text>
  <text x="52" y="198" font-size="9" fill="#e0e0e0">id · org_id (FK)</text>
  <text x="52" y="212" font-size="9" fill="#e0e0e0">username · password</text>
  <text x="52" y="226" font-size="9" fill="#e0e0e0">name · email · role</text>
  <text x="52" y="240" font-size="9" fill="#e0e0e0">is_active</text>

  <!-- clients -->
  <rect x="200" y="60" width="145" height="100" rx="7" fill="#616161"/>
  <rect x="200" y="60" width="145" height="24" rx="7" fill="#444"/>
  <rect x="200" y="76" width="145" height="8" rx="0" fill="#444"/>
  <text x="272" y="77" text-anchor="middle" font-size="10" font-weight="700" fill="white">👥 clients</text>
  <text x="212" y="100" font-size="9" fill="#e0e0e0">id · org_id (FK)</text>
  <text x="212" y="114" font-size="9" fill="#e0e0e0">legal_name · tax_id</text>
  <text x="212" y="128" font-size="9" fill="#e0e0e0">sector_id · size_id</text>
  <text x="212" y="142" font-size="9" fill="#e0e0e0">email · phone</text>

  <!-- service_catalog -->
  <rect x="200" y="178" width="145" height="100" rx="7" fill="#616161"/>
  <rect x="200" y="178" width="145" height="24" rx="7" fill="#444"/>
  <rect x="200" y="194" width="145" height="8" rx="0" fill="#444"/>
  <text x="272" y="195" text-anchor="middle" font-size="10" font-weight="700" fill="white">🗂️ service_catalog</text>
  <text x="212" y="218" font-size="9" fill="#e0e0e0">id · org_id (FK)</text>
  <text x="212" y="232" font-size="9" fill="#e0e0e0">name</text>
  <text x="212" y="246" font-size="9" fill="#e0e0e0">billing_model (ENUM)</text>
  <text x="212" y="260" font-size="9" fill="#e0e0e0">base_price · is_active</text>

  <!-- QUOTES GROUP -->
  <rect x="375" y="55" width="150" height="115" rx="7" fill="#f57c00" opacity="0.15" stroke="#f57c00" stroke-width="1.5"/>
  <text x="450" y="72" text-anchor="middle" font-size="9" font-weight="700" fill="#f57c00">COTIZACIONES</text>
  <text x="387" y="90" font-size="9" fill="#5a5a5a">quotes: id·number·client_id</text>
  <text x="387" y="104" font-size="9" fill="#5a5a5a">status·total·sector</text>
  <text x="387" y="118" font-size="9" fill="#5a5a5a">quote_items: id·quote_id</text>
  <text x="387" y="132" font-size="9" fill="#5a5a5a">quote_status_log</text>
  <text x="387" y="146" font-size="9" fill="#5a5a5a">quote_sequence (año)</text>
  <text x="387" y="160" font-size="9" fill="#5a5a5a">BORRADOR→CONVERTIDA</text>

  <!-- CONTRACTED SERVICES -->
  <rect x="375" y="185" width="150" height="115" rx="7" fill="#2e7d32" opacity="0.12" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="450" y="202" text-anchor="middle" font-size="9" font-weight="700" fill="#2e7d32">CONTRATOS</text>
  <text x="387" y="220" font-size="9" fill="#5a5a5a">contracted_services</text>
  <text x="387" y="234" font-size="9" fill="#5a5a5a">id·number·client_id</text>
  <text x="387" y="248" font-size="9" fill="#5a5a5a">status·billing_status</text>
  <text x="387" y="262" font-size="9" fill="#5a5a5a">contracted_service_items</text>
  <text x="387" y="276" font-size="9" fill="#5a5a5a">service_orders</text>
  <text x="387" y="290" font-size="9" fill="#5a5a5a">PENDIENTE→COMPLETADO</text>

  <!-- INVOICES / PAYMENTS -->
  <rect x="555" y="55" width="155" height="115" rx="7" fill="#7b1fa2" opacity="0.1" stroke="#7b1fa2" stroke-width="1.5"/>
  <text x="632" y="72" text-anchor="middle" font-size="9" font-weight="700" fill="#7b1fa2">FACTURACIÓN</text>
  <text x="567" y="90" font-size="9" fill="#5a5a5a">invoices: id·org_id</text>
  <text x="567" y="104" font-size="9" fill="#5a5a5a">client_id·number·total</text>
  <text x="567" y="118" font-size="9" fill="#5a5a5a">status·issue_date</text>
  <text x="567" y="132" font-size="9" fill="#5a5a5a">payments: id·invoice_id</text>
  <text x="567" y="146" font-size="9" fill="#5a5a5a">amount·method·paid_at</text>
  <text x="567" y="160" font-size="9" fill="#5a5a5a">invoice_sequences</text>

  <!-- PIPELINE -->
  <rect x="555" y="185" width="155" height="115" rx="7" fill="#f57c00" opacity="0.1" stroke="#f57c00" stroke-width="1.5"/>
  <text x="632" y="202" text-anchor="middle" font-size="9" font-weight="700" fill="#f57c00">PIPELINE</text>
  <text x="567" y="220" font-size="9" fill="#5a5a5a">deal: id·org_id</text>
  <text x="567" y="234" font-size="9" fill="#5a5a5a">client_id·lead_id</text>
  <text x="567" y="248" font-size="9" fill="#5a5a5a">title·amount·stage</text>
  <text x="567" y="262" font-size="9" fill="#5a5a5a">marketing_lead</text>
  <text x="567" y="276" font-size="9" fill="#5a5a5a">leads · lead_forms</text>
  <text x="567" y="290" font-size="9" fill="#5a5a5a">PROSPECTO→CERRADO</text>

  <!-- NPS -->
  <rect x="735" y="55" width="155" height="115" rx="7" fill="#e65100" opacity="0.1" stroke="#e65100" stroke-width="1.5"/>
  <text x="812" y="72" text-anchor="middle" font-size="9" font-weight="700" fill="#e65100">NPS</text>
  <text x="747" y="90" font-size="9" fill="#5a5a5a">nps_invites</text>
  <text x="747" y="104" font-size="9" fill="#5a5a5a">id·client_service_id</text>
  <text x="747" y="118" font-size="9" fill="#5a5a5a">token·status·expires_at</text>
  <text x="747" y="132" font-size="9" fill="#5a5a5a">nps_responses</text>
  <text x="747" y="146" font-size="9" fill="#5a5a5a">id·score (0-10)</text>
  <text x="747" y="160" font-size="9" fill="#5a5a5a">comment·created_at</text>

  <!-- NOTIFICATIONS / ALERTS -->
  <rect x="735" y="185" width="155" height="115" rx="7" fill="#1565c0" opacity="0.1" stroke="#1565c0" stroke-width="1.5"/>
  <text x="812" y="202" text-anchor="middle" font-size="9" font-weight="700" fill="#1565c0">NOTIFICACIONES</text>
  <text x="747" y="220" font-size="9" fill="#5a5a5a">alerts</text>
  <text x="747" y="234" font-size="9" fill="#5a5a5a">reminders</text>
  <text x="747" y="248" font-size="9" fill="#5a5a5a">crm_notification</text>
  <text x="747" y="262" font-size="9" fill="#5a5a5a">email_campaign</text>
  <text x="747" y="276" font-size="9" fill="#5a5a5a">email_campaign_recipient</text>

  <!-- BOTTOM ROW: ANALYTICS / REPORTS -->
  <rect x="40" y="325" width="200" height="90" rx="7" fill="#fafafa" stroke="#9e9e9e" stroke-width="1.5"/>
  <text x="140" y="343" text-anchor="middle" font-size="9" font-weight="700" fill="#5a5a5a">📊 REPORTES / AUDITORÍA</text>
  <text x="52" y="362" font-size="9" fill="#757575">report_audit_log</text>
  <text x="52" y="376" font-size="9" fill="#757575">id·org_id·user_id</text>
  <text x="52" y="390" font-size="9" fill="#757575">report_key·filtros_json</text>
  <text x="52" y="404" font-size="9" fill="#757575">created_at</text>

  <!-- PROJECTIONS -->
  <rect x="260" y="325" width="200" height="90" rx="7" fill="#fafafa" stroke="#9e9e9e" stroke-width="1.5"/>
  <text x="360" y="343" text-anchor="middle" font-size="9" font-weight="700" fill="#5a5a5a">📈 PROYECCIONES</text>
  <text x="272" y="362" font-size="9" fill="#757575">manual_projections</text>
  <text x="272" y="376" font-size="9" fill="#757575">id·org_id·year_val</text>
  <text x="272" y="390" font-size="9" fill="#757575">month_val·amount</text>
  <text x="272" y="404" font-size="9" fill="#757575">UNIQUE(org, year, month)</text>

  <!-- CLIENT SERVICE -->
  <rect x="480" y="325" width="200" height="90" rx="7" fill="#fafafa" stroke="#9e9e9e" stroke-width="1.5"/>
  <text x="580" y="343" text-anchor="middle" font-size="9" font-weight="700" fill="#5a5a5a">🔗 CLIENT_SERVICE</text>
  <text x="492" y="362" font-size="9" fill="#757575">id·client_id (FK)</text>
  <text x="492" y="376" font-size="9" fill="#757575">service_id (FK)</text>
  <text x="492" y="390" font-size="9" fill="#757575">start_date·end_date</text>
  <text x="492" y="404" font-size="9" fill="#757575">price·active·notes</text>

  <!-- SEQUENCES -->
  <rect x="700" y="325" width="200" height="90" rx="7" fill="#fafafa" stroke="#9e9e9e" stroke-width="1.5"/>
  <text x="800" y="343" text-anchor="middle" font-size="9" font-weight="700" fill="#5a5a5a">🔢 SECUENCIAS</text>
  <text x="712" y="362" font-size="9" fill="#757575">quote_sequence (year·next_val)</text>
  <text x="712" y="376" font-size="9" fill="#757575">invoice_sequences (org·year)</text>
  <text x="712" y="390" font-size="9" fill="#757575">payment_sequences (year)</text>
  <text x="712" y="404" font-size="9" fill="#757575">Numeración correlativa auto</text>

  <!-- Relations arrows (simplified) -->
  <line x1="170" y1="100" x2="200" y2="100" stroke="#9e9e9e" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#rel)"/>
  <line x1="170" y1="200" x2="200" y2="230" stroke="#9e9e9e" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#rel)"/>
  <line x1="345" y1="112" x2="375" y2="112" stroke="#f57c00" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#rel)"/>
  <line x1="345" y1="240" x2="375" y2="240" stroke="#2e7d32" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#rel)"/>
  <line x1="525" y1="112" x2="555" y2="112" stroke="#7b1fa2" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#rel)"/>
  <line x1="525" y1="240" x2="555" y2="240" stroke="#f57c00" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#rel)"/>
  <line x1="710" y1="112" x2="735" y2="112" stroke="#e65100" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#rel)"/>
  <line x1="710" y1="240" x2="735" y2="240" stroke="#1565c0" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#rel)"/>

  <!-- Stats footer -->
  <line x1="40" y1="430" x2="920" y2="430" stroke="#e0e0e0" stroke-width="1"/>
  <rect x="40" y="440" width="880" height="50" rx="8" fill="#f5f5f5"/>
  <text x="480" y="460" text-anchor="middle" font-size="10" font-weight="700" fill="#5a5a5a">Estadísticas del Esquema</text>

  <text x="120" y="480" text-anchor="middle" font-size="11" font-weight="700" fill="#f57c00">25+</text>
  <text x="120" y="492" text-anchor="middle" font-size="8" fill="#9e9e9e">tablas</text>

  <text x="260" y="480" text-anchor="middle" font-size="11" font-weight="700" fill="#f57c00">ddl-auto=none</text>
  <text x="260" y="492" text-anchor="middle" font-size="8" fill="#9e9e9e">control manual del schema</text>

  <text x="420" y="480" text-anchor="middle" font-size="11" font-weight="700" fill="#f57c00">org_id = 1</text>
  <text x="420" y="492" text-anchor="middle" font-size="8" fill="#9e9e9e">multi-tenant ready</text>

  <text x="580" y="480" text-anchor="middle" font-size="11" font-weight="700" fill="#f57c00">UTF-8 MB4</text>
  <text x="580" y="492" text-anchor="middle" font-size="8" fill="#9e9e9e">emojis y caracteres especiales</text>

  <text x="740" y="480" text-anchor="middle" font-size="11" font-weight="700" fill="#f57c00">InnoDB</text>
  <text x="740" y="492" text-anchor="middle" font-size="8" fill="#9e9e9e">transacciones + FK integrity</text>

  <text x="870" y="480" text-anchor="middle" font-size="11" font-weight="700" fill="#f57c00">MySQL 8.0</text>
  <text x="870" y="492" text-anchor="middle" font-size="8" fill="#9e9e9e">motor de base de datos</text>
</svg>
