<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" width="860" height="420" font-family="Segoe UI, Arial, sans-serif">
  <rect width="860" height="420" fill="#fafafa" rx="12"/>
  <text x="430" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#f57c00">Matriz de Roles y Permisos — VCM CRM</text>
  <line x1="40" y1="46" x2="820" y2="46" stroke="#e0e0e0" stroke-width="1.5"/>

  <!-- Role headers -->
  <!-- ADMIN -->
  <rect x="200" y="58" width="140" height="52" rx="8" fill="#b71c1c"/>
  <text x="270" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="white">🔐 ADMIN</text>
  <text x="270" y="98" text-anchor="middle" font-size="9" fill="#ffcdd2">Acceso total</text>

  <!-- MANAGER -->
  <rect x="350" y="58" width="140" height="52" rx="8" fill="#e65100"/>
  <text x="420" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="white">📊 MANAGER</text>
  <text x="420" y="98" text-anchor="middle" font-size="9" fill="#ffe0b2">Gestión comercial</text>

  <!-- USER -->
  <rect x="500" y="58" width="140" height="52" rx="8" fill="#1565c0"/>
  <text x="570" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="white">👤 USER</text>
  <text x="570" y="98" text-anchor="middle" font-size="9" fill="#bbdefb">Operaciones</text>

  <!-- OPERADOR -->
  <rect x="650" y="58" width="140" height="52" rx="8" fill="#2e7d32"/>
  <text x="720" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="white">🔧 OPERADOR</text>
  <text x="720" y="98" text-anchor="middle" font-size="9" fill="#c8e6c9">Solo lectura</text>

  <!-- Row labels -->
  <text x="30" y="138" font-size="10" font-weight="700" fill="#5a5a5a">Módulo</text>
  <text x="270" y="138" text-anchor="middle" font-size="10" fill="#9e9e9e">ADMIN</text>
  <text x="420" y="138" text-anchor="middle" font-size="10" fill="#9e9e9e">MANAGER</text>
  <text x="570" y="138" text-anchor="middle" font-size="10" fill="#9e9e9e">USER</text>
  <text x="720" y="138" text-anchor="middle" font-size="10" fill="#9e9e9e">OPERADOR</text>

  <!-- Legend -->
  <circle cx="35" cy="148" r="6" fill="#4caf50"/><text x="46" y="152" font-size="9" fill="#5a5a5a">CRUD completo</text>
  <circle cx="130" cy="148" r="6" fill="#2196f3"/><text x="141" y="152" font-size="9" fill="#5a5a5a">Lectura + escritura</text>
  <circle cx="245" cy="148" r="6" fill="#ff9800"/><text x="256" y="152" font-size="9" fill="#5a5a5a">Solo lectura</text>
  <circle cx="345" cy="148" r="6" fill="#e0e0e0"/><text x="356" y="152" font-size="9" fill="#5a5a5a">Sin acceso</text>

  <!-- Separator -->
  <line x1="40" y1="158" x2="820" y2="158" stroke="#e0e0e0" stroke-width="1"/>

  <!-- Rows -->
  <!-- Helper function: rows at y = 168 + i*30 -->
  <!-- Row data: [label, admin, manager, user, operador] where color = green/blue/orange/grey -->

  <!-- Dashboard -->
  <text x="40" y="183" font-size="10" fill="#333">Dashboard</text>
  <circle cx="270" cy="180" r="8" fill="#4caf50"/>
  <circle cx="420" cy="180" r="8" fill="#4caf50"/>
  <circle cx="570" cy="180" r="8" fill="#4caf50"/>
  <circle cx="720" cy="180" r="8" fill="#4caf50"/>

  <!-- Clientes -->
  <rect x="40" y="196" width="780" height="24" rx="3" fill="#f5f5f5" opacity="0.5"/>
  <text x="40" y="212" font-size="10" fill="#333">Clientes</text>
  <circle cx="270" cy="208" r="8" fill="#4caf50"/>
  <circle cx="420" cy="208" r="8" fill="#2196f3"/>
  <circle cx="570" cy="208" r="8" fill="#2196f3"/>
  <circle cx="720" cy="208" r="8" fill="#ff9800"/>

  <!-- Cotizaciones -->
  <text x="40" y="240" font-size="10" fill="#333">Cotizaciones</text>
  <circle cx="270" cy="236" r="8" fill="#4caf50"/>
  <circle cx="420" cy="236" r="8" fill="#2196f3"/>
  <circle cx="570" cy="236" r="8" fill="#2196f3"/>
  <circle cx="720" cy="236" r="8" fill="#ff9800"/>

  <!-- Pipeline / Deals -->
  <rect x="40" y="248" width="780" height="24" rx="3" fill="#f5f5f5" opacity="0.5"/>
  <text x="40" y="264" font-size="10" fill="#333">Pipeline / Deals</text>
  <circle cx="270" cy="260" r="8" fill="#4caf50"/>
  <circle cx="420" cy="260" r="8" fill="#2196f3"/>
  <circle cx="570" cy="260" r="8" fill="#2196f3"/>
  <circle cx="720" cy="260" r="8" fill="#e0e0e0"/>

  <!-- Servicios Contratados -->
  <text x="40" y="292" font-size="10" fill="#333">Servicios Contratados</text>
  <circle cx="270" cy="288" r="8" fill="#4caf50"/>
  <circle cx="420" cy="288" r="8" fill="#2196f3"/>
  <circle cx="570" cy="288" r="8" fill="#2196f3"/>
  <circle cx="720" cy="288" r="8" fill="#e0e0e0"/>

  <!-- Facturación / Pagos -->
  <rect x="40" y="300" width="780" height="24" rx="3" fill="#f5f5f5" opacity="0.5"/>
  <text x="40" y="316" font-size="10" fill="#333">Facturación / Pagos</text>
  <circle cx="270" cy="312" r="8" fill="#4caf50"/>
  <circle cx="420" cy="312" r="8" fill="#2196f3"/>
  <circle cx="570" cy="312" r="8" fill="#2196f3"/>
  <circle cx="720" cy="312" r="8" fill="#ff9800"/>

  <!-- Reportes -->
  <text x="40" y="344" font-size="10" fill="#333">Reportes</text>
  <circle cx="270" cy="340" r="8" fill="#4caf50"/>
  <circle cx="420" cy="340" r="8" fill="#ff9800"/>
  <circle cx="570" cy="340" r="8" fill="#ff9800"/>
  <circle cx="720" cy="340" r="8" fill="#ff9800"/>

  <!-- Auditoría -->
  <rect x="40" y="352" width="780" height="24" rx="3" fill="#f5f5f5" opacity="0.5"/>
  <text x="40" y="368" font-size="10" fill="#333">Auditoría (reportes)</text>
  <circle cx="270" cy="364" r="8" fill="#4caf50"/>
  <circle cx="420" cy="364" r="8" fill="#e0e0e0"/>
  <circle cx="570" cy="364" r="8" fill="#e0e0e0"/>
  <circle cx="720" cy="364" r="8" fill="#e0e0e0"/>

  <!-- Usuarios / Roles -->
  <text x="40" y="396" font-size="10" fill="#333">Usuarios / Roles / Config</text>
  <circle cx="270" cy="392" r="8" fill="#4caf50"/>
  <circle cx="420" cy="392" r="8" fill="#e0e0e0"/>
  <circle cx="570" cy="392" r="8" fill="#e0e0e0"/>
  <circle cx="720" cy="392" r="8" fill="#e0e0e0"/>

  <!-- Proyecciones -->
  <rect x="40" y="400" width="780" height="14" rx="3" fill="#f5f5f5" opacity="0.5"/>

  <!-- Footer -->
  <text x="430" y="416" text-anchor="middle" font-size="9" fill="#bdbdbd">Seguridad implementada en Spring Security · JWT stateless · BCrypt · CORS lista blanca · Prefijo ROLE_ automático</text>
</svg>
